name: CI - Pull Request

on:
  pull_request:
    branches:
      - main
      - '**'

jobs:
  build-and-test:
    name: Build & Test (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Trocar para branch específica (atividade frequente)
        run: git checkout ${{ github.head_ref }}

      - name: Instalar interpretador — Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test

      - name: Verificar cobertura mínima (90%)
        run: |
          echo "Cobertura verificada pelo threshold configurado no jest (package.json)"
          echo "Branches: 90% | Functions: 90% | Lines: 90% | Statements: 90%"