name: CI - Commits

on:
  push:
    branches:
      - '**'

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Verificacao de Linter
  # ──────────────────────────────────────────────
  lint:
    name: "Linter (ESLint)"
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # JOB 2: Testes de unidade, integracao e cobertura
  # ──────────────────────────────────────────────
  test:
    name: "Testes & Cobertura (Jest)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes com cobertura
        run: npm test

      - name: Verificar cobertura minima (90%)
        run: |
          echo "Cobertura verificada pelo threshold configurado no jest (package.json)"
          echo "Branches: 90% | Functions: 90% | Lines: 90% | Statements: 90%"

      - name: Publicar relatorio de cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
