<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Digital | Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <h1>Acervo Digital</h1>
            </div>
            
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por obra, autor ou descritor...">
            </div>
        </header>

        <main>
            <div id="filtersContainer" class="filters">
                <!-- Filtros gerados dinamicamente -->
            </div>

            <div id="booksGrid" class="books-grid">
                <!-- Cards de livros gerados dinamicamente -->
            </div>
        </main>
    </div>

    <!-- Modal de Detalhes -->
    <div id="bookModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" aria-label="Fechar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            
            <div class="modal-header">
                <h2 id="modalTitle">Título da Obra</h2>
                <p class="book-author" style="margin-top: 0.5rem; font-size: 1.1rem; color: var(--text-secondary);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> 
                    <span id="modalAuthor">Nome do Autor</span>
                </p>
            </div>
            
            <div class="modal-body">
                <div>
                    <h4 style="margin-bottom: 0.75rem; color: var(--text-primary); font-size: 1.1rem;">Resumo da Obra</h4>
                    <p id="modalSynopsis" class="modal-synopsis">Sinopse...</p>
                </div>
                
                <div class="modal-details">
                    <div class="detail-item">
                        <span class="detail-label">Categoria</span>
                        <span id="modalGenre" class="detail-value">Categoria</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Ano de Edição</span>
                        <span id="modalYear" class="detail-value">Ano</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Extensão</span>
                        <span id="modalPages" class="detail-value">Páginas</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Descritores</span>
                        <span id="modalTags" class="detail-value" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <!-- Tags dinâmicas -->
                        </span>
                    </div>
                </div>

                <div style="margin-top: 1.5rem; text-align: right;">
                    <button id="deleteBookBtn" class="btn-danger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        Remover do Acervo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
