<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo Digital | Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <span>Biblioteca</span>
            </div>

            <nav class="sidebar-nav">
                <p class="nav-label">Acervo</p>
                <div id="filtersContainer" class="filter-list">
                    <!-- Filtros gerados dinamicamente -->
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="stat-block">
                    <span id="totalCount" class="stat-number">0</span>
                    <span class="stat-label">obras no acervo</span>
                </div>
            </div>
        </aside>

        <div class="main-area">
            <header>
                <div class="header-left">
                    <h1 class="page-title">Acervo Digital</h1>
                    <p class="page-sub">Explore e gerencie obras literárias</p>
                </div>
                <div class="search-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Buscar obra, autor, descritor…">
                </div>
            </header>

            <main>
                <div id="booksGrid" class="books-grid">
                    <!-- Cards de livros gerados dinamicamente -->
                </div>
            </main>
        </div>
    </div>

    <!-- Modal de Detalhes -->
    <div id="bookModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" aria-label="Fechar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>

            <div class="modal-spine"></div>

            <div class="modal-inner">
                <div class="modal-top-layout">
                    <div id="modalCover" class="modal-cover-wrapper" style="display: none;"></div>
                    <div class="modal-header-text">
                        <div class="modal-genre-badge" id="modalGenreBadge">—</div>
                        <h2 id="modalTitle">Título da Obra</h2>
                        <p id="modalAuthor" class="modal-author">Autor</p>
                    </div>
                </div>

                <div class="modal-body">
                    <p id="modalSynopsis" class="modal-synopsis">Sinopse...</p>

                    <div class="modal-meta-row">
                        <div class="meta-pill">
                            <span class="meta-pill-label">Ano</span>
                            <span id="modalYear" class="meta-pill-value">—</span>
                        </div>
                        <div class="meta-pill">
                            <span class="meta-pill-label">Páginas</span>
                            <span id="modalPages" class="meta-pill-value">—</span>
                        </div>
                    </div>

                    <div class="modal-tags-section">
                        <p class="tags-label">Descritores</p>
                        <div id="modalTags" class="tags-row"></div>
                    </div>

                    <button id="deleteBookBtn" class="btn-remove">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Remover do acervo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
