<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                <h1><span class="text-gradient">Biblioteca</span> Digital</h1>
            </div>
            
            <div class="search-container">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, autor ou palavra-chave...">
            </div>
        </header>

        <main>
            <div id="filtersContainer" class="filters">
                <!-- Filtros gerados dinamicamente -->
            </div>

            <div id="booksGrid" class="books-grid">
                <!-- Cards de livros gerados dinamicamente -->
            </div>
        </main>
    </div>

    <!-- Modal de Detalhes -->
    <div id="bookModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
            
            <div class="modal-header">
                <h2 id="modalTitle">Título</h2>
                <p class="book-author" style="margin-top: 0.5rem; font-size: 1.1rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> 
                    <span id="modalAuthor">Autor</span>
                </p>
            </div>
            
            <div class="modal-body">
                <div>
                    <h4 style="margin-bottom: 0.5rem; color: var(--text-primary);">Sinopse</h4>
                    <p id="modalSynopsis" class="modal-synopsis">Sinopse...</p>
                </div>
                
                <div class="modal-details">
                    <div class="detail-item">
                        <span class="detail-label">Gênero</span>
                        <span id="modalGenre" class="detail-value">Gênero</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Ano de Publicação</span>
                        <span id="modalYear" class="detail-value">Ano</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Páginas</span>
                        <span id="modalPages" class="detail-value">Páginas</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Palavras-chave</span>
                        <span id="modalTags" class="detail-value" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <!-- Tags dinâmicas -->
                        </span>
                    </div>
                </div>

                <div style="margin-top: 1rem;">
                    <button id="deleteBookBtn" class="btn-danger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        Excluir Livro
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
