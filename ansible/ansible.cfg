[defaults]
# ==============================================================================
# Ansible Configuration — Biblioteca API
# ==============================================================================
# Define o inventário padrão, o usuário remoto, parâmetros de SSH e desativa
# a checagem de host key para ambientes automatizados de desenvolvimento/lab.
# ==============================================================================

inventory           = hosts
remote_user         = vagrant
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = yaml
interpreter_python  = auto_silent
roles_path          = roles
timeout             = 30

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
